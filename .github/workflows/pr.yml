name: Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  validation:

    if: github.event.pull_request.head.ref == 'development'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar g++
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Compilar
        run: |
          g++ cpp/Calc.cpp cpp/test_Calc.cpp -o testes

      - name: Executar testes
        run: |
          ./testes